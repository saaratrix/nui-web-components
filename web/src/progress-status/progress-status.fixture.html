<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

</head>
<body>

    <progress-status active></progress-status>
    <script src="./progress-status.js" type="module"></script>
    <script>
        const element = document.querySelector("progress-status");
        setInterval(() => {
          const isActive = !!element.hasAttribute('active');
          isActive ? element.removeAttribute('active') : element.setAttribute('active', '');
        }, 2000);
    </script>
</body>
</html>
