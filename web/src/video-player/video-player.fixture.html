<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fixture Name</title>
  <style>
    body {
      background-color: #2c2c38;
      color: #e1e1e8;
      min-height: 100dvh;
      margin: 0;
      /*display: flex;*/
      /*flex-direction: column;*/
      /*justify-content: center;*/
      /*align-items: center;*/
    }

    :root {
      --color: black;
    }

  </style>
</head>

<body>
  <div>
    <label>A setting: <input type="checkbox" id="dnd" checked></label>
    |
    <button id="add-remove-test">Try remove & add video element</button>
    |
    <button id="remove-subtitles">Remove subtitles</button>
  </div>
  <br>
  <video-player id="component" subtitles="/nui-web-components/web/src/video-player/_test/test.ass|English|eng" autoplay>
    <source slot="sources" src="_test/test.mp4" type="video/mp4" />
  </video-player>

  <script type="module" src="./video-player.js"></script>
  <script type="module">
    import { subtitlesOptions } from './video-player-subtitles.js';

    subtitlesOptions.octopusRootUrl = './subtitles-octopus/';
    subtitlesOptions.octopusDefaultFontUrl = '/nui-web-components/web/src/video-player/subtitles-octopus/liberation-sans.woff2';

    document.addEventListener('DOMContentLoaded', () => {
      /** @type {VideoPlayer} */
      const component = document.getElementById('component');

      if (component.subtitlesElement.subtitles.length > 0) {
        void component.changeSubtitles(0);
      }

      const addRemoveTestButton = document.getElementById('add-remove-test');
      addRemoveTestButton.addEventListener('click', () => {
        const parentElement = component.parentElement;
        const beforeElement = component.previousElementSibling;
        parentElement.removeChild(component);
        setTimeout(() => {
          parentElement.insertBefore(component, beforeElement.nextSibling);
        }, 250);

      });

      const removeSubtitlesButton = document.getElementById('remove-subtitles');
      removeSubtitlesButton.addEventListener('click', () => {
        component.removeAttribute('subtitles');
      });

    });
  </script>
</body>
</html>
